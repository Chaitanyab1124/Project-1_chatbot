<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecodeBot - Rule-Based Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d2540;--grid:#17385d;--panel:#10304f;--ink:#e6f0fa;--muted:#8fb0cf;--line:#2a5483;--me:#22c7e8;--me-ink:#04202b;--bot:#173f68;--hit:#ffb454;--ok:#4be08f;
--head:"Chakra Petch","Trebuchet MS",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#e9f1f8;--grid:#d3e2ef;--panel:#fff;--ink:#12304c;--muted:#566f88;--line:#b9cde0;--me:#0a7ea0;--me-ink:#fff;--bot:#e1ecf6;--hit:#c76a00;--ok:#13804a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.5 var(--body);display:flex;justify-content:center;padding:16px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;width:100%;max-width:1020px;height:100%;max-height:780px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:8px;border:2px solid var(--me);display:grid;place-items:center;color:var(--me);font:700 .95rem var(--mono)}
h1{font:700 1.3rem var(--head);margin:0;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:.85rem}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font:.78rem var(--mono);color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:beat 1.4s infinite}
.live.off{color:var(--muted)}.live.off i{background:var(--muted);animation:none}
@keyframes beat{50%{opacity:.25}}
#log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:9px 14px;border-radius:12px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg small{display:block;font:.7rem var(--mono);opacity:.6;margin-top:2px}
.bot{background:var(--bot);border-bottom-left-radius:3px;align-self:flex-start}
.me{background:var(--me);color:var(--me-ink);border-bottom-right-radius:3px;align-self:flex-end}
.typing{display:flex;gap:4px;padding:13px 14px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:beat 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.chips button,.restart{font:.85rem var(--mono);background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.chips button:hover:not(:disabled),.restart:hover{border-color:var(--me);color:var(--me)}
.chips button:disabled{opacity:.4;cursor:default}
form{display:flex;min-width:0;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.send{font:700 1rem var(--head);background:var(--me);color:var(--me-ink);border:0;border-radius:8px;padding:0 20px;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
aside{padding:16px 18px;overflow-y:auto}
aside h2{font:700 1.05rem var(--head);margin:0 0 2px}
.sub{color:var(--muted);font-size:.82rem;margin:0 0 12px}
.ipo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.node{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font:700 .85rem var(--head);color:var(--muted);transition:.25s}
.node small{display:block;font:.68rem var(--mono);font-weight:400}
.node.on{border-color:var(--me);color:var(--me);box-shadow:0 0 0 1px var(--me)}
.step{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin-bottom:10px;font-size:.88rem}
.step b{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.step code{font:.84rem var(--mono);word-break:break-word}
.step.hit{border-color:var(--hit)}.step.hit code{background:var(--hit);color:#241700;padding:0 5px;border-radius:3px}
.empty{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.spec{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);font:.8rem var(--mono)}
.spec li{display:flex;gap:8px;color:var(--muted);margin-bottom:4px}
.spec li:before{content:"\25A1";}.spec li.done{color:var(--ok)}.spec li.done:before{content:"\2611"}
.restart{display:none;margin:0 18px 14px;padding:8px}
.ended .restart{display:block}.ended form,.ended .chips{display:none}
@media (max-width:780px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;max-height:none}aside{max-height:200px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="card" id="chat" aria-label="Chat">
    <header>
      <div class="avatar" aria-hidden="true">DB</div>
      <div><h1>DecodeBot</h1><p>Rule-based, so every reply is traceable.</p></div>
      <div class="live" id="live"><i></i><span>loop running</span></div>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="f" autocomplete="off">
      <input id="in" maxlength="200" placeholder="Type a message, or 'exit' to end" aria-label="Message" autofocus>
      <button class="send" type="submit">Send</button>
    </form>
    <button class="restart" id="restart" type="button">Start a new chat</button>
  </section>
  <aside class="card" aria-label="How the bot decided">
    <h2>How it decided</h2>
    <p class="sub">Input, process, output for your latest message.</p>
    <div class="ipo" id="ipo"><div class="node">Input<small>sanitize</small></div><div class="node">Process<small>match rule</small></div><div class="node">Output<small>reply</small></div></div>
    <div id="trace"><p class="empty">Send a message to see which rule fired.</p></div>
    <ul class="spec" id="spec" aria-label="Project checklist"></ul>
  </aside>
</main>
<script>
// ---------- LOGIC START (mirrors chatbot.py) ----------
const responses = {
  "hello": ["Hi there!", "Hello! How can I help?"],
  "hi": ["Hey!", "Hi! What's up?"],
  "hey": ["Hey there!", "Hey! Good to see you."],
  "namaste": ["Namaste! How can I help?"],
  "good morning": ["Good morning! Hope your day starts well."],
  "good afternoon": ["Good afternoon! What can I do for you?"],
  "good evening": ["Good evening! How can I help?"],
  "how are you": ["I'm running perfectly, thanks!", "All systems operational!"],
  "your name": ["I'm DecodeBot, your first rule-based AI."],
  "who are you": ["I'm DecodeBot, a rule-based chatbot. Every reply comes from a rule."],
  "what can you do": ["I follow if-else rules to chat with you. Try 'help'."],
  "who made you": ["I was built as DecodeLabs Project 1 - a rule-based chatbot."],
  "joke": ["Why do programmers prefer dark mode? Because light attracts bugs.",
           "There are 10 kinds of people: those who understand binary and those who don't."],
  "help": ["Try: hello, how are you, your name, time, joke, my name is <name>, who am i, or bye."],
  "thanks": ["You're welcome!", "Anytime!"],
  "thank you": ["You're welcome!", "Happy to help!"]
};
const EXIT = new Set(["exit","quit","bye","goodbye","good bye","bye bye","ok bye","okay bye","see you","see ya"]);
const TIME = new Set(["time","date","what time is it","what is the time","whats the time","current time","what is the date","whats the date","todays date","what is todays date","what day is it"]);
const WHO = new Set(["who am i","whats my name","what is my name","do you know my name"]);
const ASK_BACK = new Set(["how are you"]);
const GOOD = new Set(["good","great","fine","well","okay","ok","awesome","happy","not bad"]);
const BAD = new Set(["bad","sad","tired","sick","not good","terrible","stressed"]);
const FALLBACK = "I do not understand. Type 'help' to see what I know.";
const EMPTY = "Say something, I'm listening!";
const TOO_LONG = "That message is too long for me. Please keep it under 200 characters.";
const NAME_HINT = "I'd love to know your name. Try: my name is Rahul.";
const NAME_REJECT = "Please give just your name (up to 3 words), e.g. 'my name is Rahul'.";
const MAX_LEN = 200;
const NAME_RE = /(?:^|\s)my name is(?:\s+(.*))?$/;
let state = {name: null, awaiting: null};

const sanitize = t => t.toLowerCase().replace(/['\u2019\u2018]/g, "")
  .replace(/[^\p{L}\p{M}\p{N}\s]|_/gu, " ").split(/\s+/).filter(Boolean).join(" ");
const pick = a => a[Math.floor(Math.random() * a.length)];
const titleCase = s => s.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
function timeReply() {
  const n = new Date(), h = n.getHours();
  const d = (o) => n.toLocaleDateString("en-US", o);
  return `It's ${h % 12 || 12}:${String(n.getMinutes()).padStart(2, "0")} ${h < 12 ? "AM" : "PM"} on ${d({weekday:"long"})}, ${n.getDate()} ${d({month:"long"})} ${n.getFullYear()}.`;
}
function getReply(clean) {
  const awaiting = state.awaiting; state.awaiting = null;
  if (awaiting === "mood") {
    if (GOOD.has(clean)) return ["Glad to hear it! Anything I can help with?", "follow-up: good mood"];
    if (BAD.has(clean)) return ["Sorry to hear that. Type 'joke' if you want a smile.", "follow-up: bad mood"];
  }
  const m = clean.match(NAME_RE);
  if (m) {
    const raw = m[1];
    if (!raw) return [NAME_HINT, "name memory: missing name"];
    if (raw.split(" ").length > 3 || raw.length > 30 || !/\p{L}/u.test(raw)) return [NAME_REJECT, "name memory: rejected"];
    state.name = titleCase(raw);
    return [`Nice to meet you, ${state.name}!`, "name memory"];
  }
  if (WHO.has(clean)) return [state.name ? `You're ${state.name}.` : "I don't know your name yet.", "name recall"];
  if (TIME.has(clean)) return [timeReply(), "time intent"];
  let options = Object.hasOwn(responses, clean) ? responses[clean] : null, key = clean, rule = `exact match: '${clean}'`;
  if (!options) {
    const padded = ` ${clean} `;
    for (const k of Object.keys(responses).sort((a, b) => b.length - a.length))
      if (padded.includes(` ${k} `)) { options = responses[k]; key = k; rule = `phrase match: '${k}'`; break; }
  }
  if (options) {
    let reply = pick(options);
    if (ASK_BACK.has(key)) { reply += " And you?"; state.awaiting = "mood"; }
    return [reply, rule];
  }
  return [FALLBACK, "fallback"];
}
function respond(raw) {
  if (raw.length > MAX_LEN) return [TOO_LONG, "guardrail: input too long", false, ""];
  const clean = sanitize(raw);
  if (clean === "") return [EMPTY, "empty input", false, clean];
  if (EXIT.has(clean)) return ["Goodbye!", "exit command: break", true, clean];
  const [reply, rule] = getReply(clean);
  return [reply, rule, false, clean];
}
// ---------- LOGIC END ----------

// ---------- UI ----------
const $ = id => document.getElementById(id);
const log = $("log"), input = $("in"), trace = $("trace"), nodes = [...$("ipo").children];
const used = new Set(["loop"]);
const SPEC = [["loop","Input loop: while True"],["clean","Sanitization: case, space, punctuation"],["kb","Knowledge base: " + Object.keys(responses).length + " intents"],["fallback","Fallback: unknown input"],["exit","Exit strategy: clean break"]];
function drawSpec() {
  $("spec").innerHTML = SPEC.map(([k, t]) => `<li class="${used.has(k) ? "done" : ""}">${t}</li>`).join("");
}
function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  const t = document.createElement("small");
  t.textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  d.appendChild(t); log.appendChild(d); log.scrollTop = log.scrollHeight;
}
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function showTrace(raw, clean, rule, hit) {
  trace.innerHTML =
    `<div class="step"><b>Input (raw)</b><code>${esc(JSON.stringify(raw))}</code></div>` +
    `<div class="step"><b>Sanitized</b><code>${esc(JSON.stringify(clean))}</code></div>` +
    `<div class="step ${hit ? "hit" : ""}"><b>Rule matched</b><code>${esc(rule)}</code></div>` +
    (rule.startsWith("exact") ? `<div class="step"><b>Lookup cost</b><code>O(1) dictionary get</code></div>` : "");
}
function flow() { nodes.forEach((n, i) => { n.classList.remove("on"); setTimeout(() => n.classList.add("on"), i * 160); }); }
let busy = false;
function handle(raw) {
  if (busy || state.ended) return;
  add(raw, "me"); busy = true;
  const [reply, rule, done, clean] = respond(raw);
  if (clean !== raw.trim()) used.add("clean");
  if (done) used.add("exit"); else if (rule === "fallback") used.add("fallback");
  if (/^(exact|phrase)/.test(rule)) used.add("kb");
  flow();
  const t = document.createElement("div"); t.className = "msg bot typing"; t.innerHTML = "<i></i><i></i><i></i>";
  log.appendChild(t); log.scrollTop = log.scrollHeight;
  setTimeout(() => {
    t.remove(); add(reply, "bot"); showTrace(raw, clean, rule, rule !== "fallback" && rule !== "empty input");
    drawSpec(); busy = false;
    if (done) end();
  }, 450);
}
function end() {
  state.ended = true; $("chat").classList.add("ended");
  $("live").classList.add("off"); $("live").lastChild.textContent = "loop stopped";
}
function start() {
  state = {name: null, awaiting: null}; log.innerHTML = ""; used.clear(); used.add("loop");
  $("chat").classList.remove("ended"); $("live").classList.remove("off"); $("live").lastChild.textContent = "loop running";
  trace.innerHTML = '<p class="empty">Send a message to see which rule fired.</p>';
  nodes.forEach(n => n.classList.remove("on")); drawSpec();
  add("Hi! I'm DecodeBot. Type 'exit' to quit.", "bot"); input.focus();
}
$("f").addEventListener("submit", e => { e.preventDefault(); const v = input.value; input.value = ""; handle(v); });
$("restart").onclick = start;
["hello", "how are you", "time", "joke", "my name is Rahul", "who am i", "help"].forEach(t => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = t;
  b.onclick = () => handle(t); $("chips").appendChild(b);
});
start();
</script>
</body>
</html>
